<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Start abonnement?</h1>
    <label for="First name"></label>
    <form>
        <input type="text" placeholder="Voornaam" id="Voornaam" name="Voornaam" pattern="[A-Za-zÀ-ÿ ]+"
            title="Alleen letters invullen" required>
        <br>
        <input type="text" placeholder="Achternaam" id="Achternaam" name="Achternaam" pattern="[A-Za-zÀ-ÿ ]+"
            title="Alleen letters invullen" required>
        <button type="submit">Aanmelden</button>
        <br>
        <fieldset>
            <legend>Aanhef</legend>

            <div>
                <input type="radio" id="huey" name="drone" value="Dhr." checked required />
                <label for="dhr.">Dhr.</label>
            </div>

            <div>
                <input type="radio" id="Mevr." name="drone" value="Mevr." required />
                <label for="mevr">Mevr.</label>
            </div>

            <div>
                <input type="radio" id="anders" name="drone" value="Anders" required />
                <label for="anders">Anders</label>
            </div>
        </fieldset>
        <br>

        <input type="plaats" placeholder="plaats">
        <br>
        <input type="straat" placeholder="straat">
        <br>
        <input type="huisnummer" placeholder="huisnummer">
        <br>
        <br>
        <label for="europa-landen">In welk land woont u:</label>
        <br>
        <select id="europa-landen" name="landen">
            <option value="">-- Selecteer een land --</option>
            <option value="albanie">Albanië</option>
            <option value="andorra">Andorra</option>
            <option value="belgie">België</option>
            <option value="bosnie">Bosnië en Herzegovina</option>
            <option value="bulgarije">Bulgarije</option>
            <option value="cyprus">Cyprus</option>
            <option value="denemarken">Denemarken</option>
            <option value="duitsland">Duitsland</option>
            <option value="estland">Estland</option>
            <option value="finland">Finland</option>
            <option value="frankrijk">Frankrijk</option>
            <option value="griekenland">Griekenland</option>
            <option value="hongarije">Hongarije</option>
            <option value="ierland">Ierland</option>
            <option value="ijsland">Ijsland</option>
            <option value="italie">Italië</option>
            <option value="kosovo">Kosovo</option>
            <option value="kroatie">Kroatië</option>
            <option value="letland">Letland</option>
            <option value="liechtenstein">Liechtenstein</option>
            <option value="litouwen">Litouwen</option>
            <option value="luxemburg">Luxemburg</option>
            <option value="malta">Malta</option>
            <option value="moldavie">Moldavië</option>
            <option value="monaco">Monaco</option>
            <option value="montenegro">Montenegro</option>
            <option value="nederland">Nederland</option>
            <option value="noord-macedonie">Noord-Macedonië</option>
            <option value="noorwegen">Noorwegen</option>
            <option value="oekraine">Oekraïne</option>
            <option value="oostenrijk">Oostenrijk</option>
            <option value="polen">Polen</option>
            <option value="portugal">Portugal</option>
            <option value="roemenie">Roemenië</option>
            <option value="rusland">Rusland</option>
            <option value="san-marino">San Marino</option>
            <option value="servie">Servië</option>
            <option value="slovakije">Slowakije</option>
            <option value="slovenie">Slowakije</option>
            <option value="spanje">Spanje</option>
            <option value="tsjechie">Tsjechië</option>
            <option value="turkije">Turkije</option>
            <option value="vaticaanstad">Vaticaanstad</option>
            <option value="verenigd-koninkrijk">Verenigd Koninkrijk</option>
            <option value="wit-rusland">Wit-Rusland</option>
            <option value="zweden">Zweden</option>
            <option value="zwitserland">Zwitserland</option>
        </select>
        <div class="groep1">
            <section>
                <label for="iban">Voer je IBAN in:</label>
            </section>
            <br>
            <input type="text" id="iban" name="iban" required pattern="^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$" maxlength="18"
                minlength="18" title="Voer een geldige IBAN in zonder spaties"
                oninput="this.value = this.value.toUpperCase().replace(/\s+/g, '')">
            <button type="submit">Versturen</button>
        </div>
        <br>
        <div>
            <input type="radio" id="mobiel" name="mobiel" value="mobiel" checked required />
            <label for="mobiel">Mobiel</label>
        </div>

        <div>
            <input type="radio" id="glasvezel" name="glasvezel" value="glasvezel" required />
            <label for="glasvezel">Glasvezel</label>
        </div>

        <div>
            <input type="radio" id="TV" name="TV" value="TV" required />
            <label for="TV">TV</label>
        </div>
        <br>
        <label for="start">Datum van validatie: </label>

        <input type="date" id="start" name="datum van validatie" value="2018-07-22" min="2026-09-24" max="2026-12-28" required/>
        <br>
  <label for="duration">Kies de looptijd van uw abonnement:</label>
  <select id="duration" name="duration">
    <option value="1">1 Maand (Flexibel)</option>
    <option value="12">12 Maanden (1 Jaar)</option>
    <option value="24">24 Maanden (2 Jaar)</option>
  </select>
  <button type="submit">Abonneren</button>
  <br>
    <label for="aantal-personen">Aantal personen voor het abonnement:</label>
  <input 
    type="number" 
    id="aantal-personen" 
    name="aantal_personen" 
    min="1" 
    max="10" 
    value="1" 
    required>
  
  <button type="submit">Abonnement afsluiten</button>
  <br>
  <input type="email" name="mail" id="mail" placeholder="Email" required>
  <br>
  <input type="password" name="wachtwoord" id="wachtwoord" placeholder="Wachtwoord" required>
  <br>
  <br>
  <label for="Sluit abonnement af"></label>
  <input type="button" name="verzend knop" id="verzenden" value="Sluit abonnement af" required>
</form>

</body>

</html>
